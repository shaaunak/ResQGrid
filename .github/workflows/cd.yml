name: ResQGrid Continuous Deployment (CD)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write  # Required for AWS OIDC authentication
  contents: read

jobs:
  build-and-deploy:
    name: Build Containers, Push to ECR, Deploy to ASG & Smoke Test /health
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC - Zero Long-Lived Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Tag Metadata
        id: meta
        run: |
          SHA_TAG="sha-${GITHUB_SHA::8}"
          echo "IMAGE_TAG=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_OUTPUT

      - name: Build & Tag API Docker Image
        run: |
          docker build \
            -t ${{ steps.meta.outputs.ECR_REGISTRY }}/resqgrid-api-prod:${{ steps.meta.outputs.IMAGE_TAG }} \
            -t ${{ steps.meta.outputs.ECR_REGISTRY }}/resqgrid-api-prod:latest \
            -f apps/api/Dockerfile apps/api

      - name: Build & Tag Worker Docker Image
        run: |
          docker build \
            -t ${{ steps.meta.outputs.ECR_REGISTRY }}/resqgrid-worker-prod:${{ steps.meta.outputs.IMAGE_TAG }} \
            -t ${{ steps.meta.outputs.ECR_REGISTRY }}/resqgrid-worker-prod:latest \
            -f apps/api/Dockerfile.worker apps/api

      - name: Push Images to Amazon ECR
        run: |
          docker push ${{ steps.meta.outputs.ECR_REGISTRY }}/resqgrid-api-prod:${{ steps.meta.outputs.IMAGE_TAG }}
          docker push ${{ steps.meta.outputs.ECR_REGISTRY }}/resqgrid-api-prod:latest
          docker push ${{ steps.meta.outputs.ECR_REGISTRY }}/resqgrid-worker-prod:${{ steps.meta.outputs.IMAGE_TAG }}
          docker push ${{ steps.meta.outputs.ECR_REGISTRY }}/resqgrid-worker-prod:latest

      - name: Deploy to Auto Scaling Group via Instance Refresh
        env:
          ASG_NAME: ${{ secrets.AWS_ASG_NAME }}
        run: |
          echo "Triggering Auto Scaling Group instance refresh for ${ASG_NAME}..."
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${ASG_NAME}" \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 180}'

      - name: Smoke Test Live Application via ALB Endpoint (/api/v1/health)
        env:
          ALB_ENDPOINT: ${{ secrets.ALB_DNS_NAME }}
        run: |
          echo "Running automated smoke test against ALB endpoint: http://${ALB_ENDPOINT}/api/v1/health"
          # Retry up to 10 times with 10s intervals for target group health propagation
          for i in {1..10}; do
            HEALTH_JSON=$(curl -s -f "http://${ALB_ENDPOINT}/api/v1/health" || echo "")
            if echo "$HEALTH_JSON" | grep '"status":"healthy"'; then
              echo "Smoke test PASSED on attempt $i!"
              echo "Health payload: $HEALTH_JSON"
              exit 0
            fi
            echo "Waiting for ALB target health (attempt $i)..."
            sleep 10
          done
          echo "ERROR: Smoke test failed after 10 attempts."
          exit 1
