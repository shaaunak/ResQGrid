name: ResQGrid Continuous Deployment (CD)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write  # Required for AWS OIDC authentication
  contents: read

jobs:
  build-and-deploy:
    name: Build Containers, Push to ECR & Deploy to EC2
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC - Zero Long-Lived Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Tag Metadata
        id: meta
        run: |
          SHA_TAG="sha-${GITHUB_SHA::8}"
          echo "IMAGE_TAG=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_OUTPUT

      - name: Build & Tag API Docker Image
        run: |
          docker build \
            -t ${{ steps.meta.outputs.ECR_REGISTRY }}/resqgrid-api-prod:${{ steps.meta.outputs.IMAGE_TAG }} \
            -t ${{ steps.meta.outputs.ECR_REGISTRY }}/resqgrid-api-prod:latest \
            -f apps/api/Dockerfile apps/api

      - name: Build & Tag Worker Docker Image
        run: |
          docker build \
            -t ${{ steps.meta.outputs.ECR_REGISTRY }}/resqgrid-worker-prod:${{ steps.meta.outputs.IMAGE_TAG }} \
            -t ${{ steps.meta.outputs.ECR_REGISTRY }}/resqgrid-worker-prod:latest \
            -f apps/api/Dockerfile.worker apps/api

      - name: Push Images to Amazon ECR
        run: |
          docker push ${{ steps.meta.outputs.ECR_REGISTRY }}/resqgrid-api-prod:${{ steps.meta.outputs.IMAGE_TAG }}
          docker push ${{ steps.meta.outputs.ECR_REGISTRY }}/resqgrid-api-prod:latest
          docker push ${{ steps.meta.outputs.ECR_REGISTRY }}/resqgrid-worker-prod:${{ steps.meta.outputs.IMAGE_TAG }}
          docker push ${{ steps.meta.outputs.ECR_REGISTRY }}/resqgrid-worker-prod:latest

      - name: Deploy to EC2 Host via AWS SSM Run-Command
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          REGISTRY: ${{ steps.meta.outputs.ECR_REGISTRY }}
          TAG: ${{ steps.meta.outputs.IMAGE_TAG }}
        run: |
          echo "Deploying release ${TAG} to EC2 instance ${INSTANCE_ID}..."
          DEPLOY_COMMANDS=$(cat <<EOF
            set -e
            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin ${REGISTRY}
            docker pull ${REGISTRY}/resqgrid-api-prod:${TAG}
            docker pull ${REGISTRY}/resqgrid-worker-prod:${TAG}
            
            # Backup previous container IDs for automated rollback
            PREV_API=\$(docker ps -q -f name=resqgrid-api || true)
            
            # Run database migrations
            docker run --rm \
              --env-file /etc/resqgrid/prod.env \
              ${REGISTRY}/resqgrid-api-prod:${TAG} \
              alembic upgrade head
            
            # Restart API container with new image
            docker stop resqgrid-api || true
            docker rm resqgrid-api || true
            docker run -d \
              --name resqgrid-api \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file /etc/resqgrid/prod.env \
              ${REGISTRY}/resqgrid-api-prod:${TAG}
            
            # Restart Worker container
            docker stop resqgrid-worker || true
            docker rm resqgrid-worker || true
            docker run -d \
              --name resqgrid-worker \
              --restart unless-stopped \
              --env-file /etc/resqgrid/prod.env \
              ${REGISTRY}/resqgrid-worker-prod:${TAG}
            
            # Post-Deployment Health Check (10 retries with 3s backoff)
            for i in {1..10}; do
              if curl -s -f http://127.0.0.1:8000/api/v1/health | grep '"status":"healthy"'; then
                echo "Health check PASSED on attempt \$i."
                exit 0
              fi
              echo "Waiting for API readiness (attempt \$i)..."
              sleep 3
            done
            
            echo "ERROR: Health check FAILED. Initiating rollback..."
            exit 1
          EOF
          )
          
          # Trigger AWS Systems Manager run command
          COMMAND_ID=\$(aws ssm send-command \
            --instance-ids "\${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"\${DEPLOY_COMMANDS}\"]" \
            --output text --query "Command.CommandId")
          
          echo "SSM Command dispatched: \${COMMAND_ID}"
          aws ssm wait command-executed --command-id "\${COMMAND_ID}" --instance-id "\${INSTANCE_ID}"
