name: ResQGrid CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  security-audit:
    name: Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan for Hardcoded AWS & Database Secrets
        run: |
          echo "Scanning codebase for unauthorized credentials and private keys..."
          # Scan for AWS access keys, secret keys, and private cert headers
          ! grep -rnEI 'AKIA[0-9A-Z]{16}' apps/ infrastructure/ || { echo "ERROR: AWS Access Key ID detected!"; exit 1; }
          ! grep -rnEI 'BEGIN RSA PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY' . || { echo "ERROR: Private key detected!"; exit 1; }
          echo "Secret scan passed successfully. Zero hardcoded secrets detected."

  backend-tests:
    name: Backend Test Suite & Concurrency Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          JWT_SECRET: "ci-test-secret-key-32-chars-minimum-length"
          AWS_DEFAULT_REGION: "ap-south-1"
        run: |
          PYTHONPATH=apps/api pytest apps/api/tests -v --durations=10

  frontend-build:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run TypeScript & Vite Build
        working-directory: apps/web
        run: npm run build

  terraform-lint:
    name: Terraform Validation & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive infrastructure/terraform/

      - name: Validate Terraform Prod Configuration
        run: |
          cd infrastructure/terraform/environments/prod
          terraform init -backend=false
          terraform validate

